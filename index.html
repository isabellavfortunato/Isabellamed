<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#9B9BA1">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="apple-mobile-web-app-title" content="Rotina">
<title>Sua rotina completa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --tinta:#1C1C1E;
    --grafite:#4A4A4F;
    --cinza:#6E6E73;
    --cinza-medio:#9B9BA1;
    --cinza-claro:#C9C9CE;
    --linha:#E6E6E9;
    --fundo:#F4F4F5;
    --tinta-med:rgba(28,28,30,0.05);
    --borda-med:rgba(28,28,30,0.14);
    --texto-suave:#9B9BA1;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Poppins',system-ui,sans-serif;
    background:
      radial-gradient(1200px 500px at 80% -10%, rgba(28,28,30,0.06), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(28,28,30,0.05), transparent 60%),
      var(--fundo);
    color:#1C1C1E;min-height:100vh;display:flex;justify-content:center;
    padding:32px 18px 56px;line-height:1.45;
  }
  .day{width:100%;max-width:520px;}
  header{margin-bottom:18px;}
  .eyebrow{font-size:12px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--cinza-medio);margin-bottom:8px;}
  h1{font-size:26px;font-weight:700;color:var(--tinta);letter-spacing:-0.01em;}
  .data{margin-top:6px;font-size:14px;font-weight:500;color:var(--cinza);}

  .tabs{display:flex;gap:6px;background:#fff;border:1px solid var(--linha);border-radius:999px;padding:5px;margin-top:18px;box-shadow:0 6px 18px rgba(28,28,30,0.05);}
  .tab{flex:1;text-align:center;padding:9px;border-radius:999px;font-weight:600;font-size:13.5px;color:var(--texto-suave);cursor:pointer;border:none;background:transparent;font-family:inherit;transition:all .15s;}
  .tab.ativo{background:linear-gradient(135deg,var(--tinta),var(--grafite));color:#fff;}

  .barra{margin-top:18px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border:1px solid var(--linha);border-radius:14px;padding:12px 15px;box-shadow:0 6px 18px rgba(28,28,30,0.05);}
  .barra .texto{font-size:13.5px;font-weight:500;color:var(--tinta);}
  .barra button{border:none;cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--grafite);background:rgba(28,28,30,0.07);padding:7px 13px;border-radius:999px;transition:background .15s;}
  .barra button:hover{background:rgba(28,28,30,0.14);}

  .editando{margin-top:12px;font-size:13px;color:var(--cinza);display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .editando b{color:var(--tinta);font-weight:600;}
  .editando button{border:none;cursor:pointer;font-family:inherit;font-size:12px;font-weight:600;color:var(--grafite);background:rgba(28,28,30,0.07);padding:5px 11px;border-radius:999px;}

  .timeline{position:relative;list-style:none;margin-top:22px;padding-left:34px;}
  .timeline::before{content:"";position:absolute;left:11px;top:6px;bottom:6px;width:3px;border-radius:3px;background:linear-gradient(to bottom,var(--cinza-claro) 0%,var(--cinza-medio) 35%,var(--grafite) 70%,var(--tinta) 100%);opacity:0.7;}
  .entry{position:relative;margin-bottom:14px;}
  .node{position:absolute;left:-29px;top:18px;width:18px;height:18px;border-radius:50%;z-index:1;}
  .med .node{background:linear-gradient(145deg,var(--tinta),var(--grafite));box-shadow:0 0 0 4px var(--fundo),0 4px 10px rgba(28,28,30,0.3);}
  .leve .node{background:#fff;border:3px solid var(--cinza-claro);box-shadow:0 0 0 4px var(--fundo);}
  .card{border-radius:16px;padding:14px 16px;display:flex;align-items:flex-start;gap:13px;width:100%;text-align:left;}
  label.card{cursor:pointer;-webkit-tap-highlight-color:transparent;}
  .med .card{background:var(--tinta-med);border:1px solid var(--borda-med);}
  .leve .card{background:rgba(28,28,30,0.03);border:1px dashed rgba(28,28,30,0.14);}
  .chk{position:absolute;opacity:0;pointer-events:none;}
  .box{flex:0 0 auto;width:22px;height:22px;border-radius:7px;margin-top:1px;border:2px solid var(--grafite);background:#fff;position:relative;transition:all .15s;}
  .leve .box{border-color:var(--cinza-claro);}
  .box::after{content:"";position:absolute;left:6px;top:2px;width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) scale(0);transition:transform .15s;}
  .chk:checked + .box{background:linear-gradient(145deg,var(--tinta),var(--grafite));border-color:var(--tinta);}
  .leve .chk:checked + .box{background:linear-gradient(145deg,var(--grafite),var(--cinza));border-color:var(--grafite);}
  .chk:checked + .box::after{transform:rotate(45deg) scale(1);}
  .chk:focus-visible + .box{outline:3px solid rgba(28,28,30,0.35);outline-offset:2px;}
  .hora{flex:0 0 auto;font-size:13px;font-weight:600;padding:6px 11px;border-radius:999px;white-space:nowrap;line-height:1.1;margin-top:1px;}
  .med .hora{background:linear-gradient(135deg,var(--tinta),var(--grafite));color:#fff;}
  .leve .hora{background:transparent;color:var(--texto-suave);border:1px solid var(--linha);}
  .conteudo{padding-top:2px;display:flex;flex-direction:column;}
  .item{font-size:15.5px;font-weight:600;color:#1C1C1E;transition:opacity .15s;}
  .leve .item{font-weight:500;color:var(--texto-suave);}
  .nota{margin-top:3px;font-size:12.5px;font-weight:400;color:var(--cinza);}
  .entry.feito .item{opacity:.45;text-decoration:line-through;}
  .entry.feito .nota{opacity:.5;}
  .marcador .card{padding-left:16px;}

  /* mês */
  #viewMes{margin-top:22px;}
  .cal-topo{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .cal-titulo{font-size:17px;font-weight:600;color:var(--tinta);}
  .cal-nav{display:flex;gap:8px;}
  .cal-nav button{width:36px;height:36px;border-radius:10px;border:1px solid var(--linha);background:#fff;color:var(--tinta);font-size:18px;cursor:pointer;font-family:inherit;line-height:1;}
  .cal-nav button:hover{background:#EFEFF1;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cal-dow{font-size:11px;text-align:center;color:var(--texto-suave);font-weight:600;text-transform:capitalize;padding-bottom:2px;}
  .cal-cell{aspect-ratio:1/1;border-radius:12px;border:1px solid var(--linha);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:#1C1C1E;cursor:pointer;background:#fff;}
  .cal-cell .frac{font-size:9.5px;font-weight:500;color:var(--texto-suave);margin-top:1px;}
  .cal-cell.cheio{color:#fff;}
  .cal-cell.cheio .frac{color:rgba(255,255,255,0.85);}
  .cal-cell.hoje{box-shadow:0 0 0 2px var(--tinta);}
  .cal-vazio{background:transparent;border:none;cursor:default;}
  .cal-resumo{margin-top:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border:1px solid var(--linha);border-radius:14px;padding:12px 15px;box-shadow:0 6px 18px rgba(28,28,30,0.05);}
  .cal-resumo .texto{font-size:13.5px;font-weight:500;color:var(--tinta);}
  .cal-resumo button{border:none;cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:600;color:#fff;background:linear-gradient(135deg,var(--tinta),var(--grafite));padding:8px 14px;border-radius:999px;}
  .escondido{display:none !important;}

  /* login */
  .overlay{position:fixed;inset:0;background:var(--fundo);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50;}
  .login{width:100%;max-width:360px;background:#fff;border:1px solid var(--linha);border-radius:20px;padding:26px 24px;box-shadow:0 18px 50px rgba(28,28,30,0.12);}
  .login h2{font-size:21px;font-weight:700;color:var(--tinta);margin-bottom:4px;}
  .login p{font-size:13px;color:var(--texto-suave);margin-bottom:18px;line-height:1.4;}
  .login label{display:block;font-size:12.5px;font-weight:600;color:var(--cinza);margin-bottom:6px;}
  .login input{width:100%;font-family:inherit;font-size:15px;padding:12px 14px;border:1px solid var(--cinza-claro);border-radius:12px;margin-bottom:14px;color:#1C1C1E;}
  .login input:focus{outline:none;border-color:var(--grafite);box-shadow:0 0 0 3px rgba(28,28,30,0.14);}
  .login button{width:100%;border:none;cursor:pointer;font-family:inherit;font-size:15px;font-weight:600;color:#fff;background:linear-gradient(135deg,var(--tinta),var(--grafite));padding:13px;border-radius:12px;}
  .login button:disabled{opacity:.6;cursor:default;}
  .login .erro{font-size:12.5px;color:#8A2A22;margin-bottom:12px;min-height:16px;}
  .est-intro{margin-top:18px;font-size:12.5px;color:var(--cinza);line-height:1.5;}
  .estoque-lista{display:flex;flex-direction:column;gap:11px;margin-top:14px;}
  .est-card{background:#fff;border:1px solid var(--linha);border-radius:14px;padding:14px 15px;box-shadow:0 6px 18px rgba(28,28,30,0.05);}
  .est-topo{display:flex;align-items:baseline;justify-content:space-between;gap:12px;}
  .est-nome{font-size:15px;font-weight:600;color:var(--tinta);}
  .est-dias{font-size:13px;font-weight:600;color:var(--grafite);white-space:nowrap;}
  .est-card.baixo{border-color:#E9C3BE;background:#FDF6F5;}
  .est-card.baixo .est-dias{color:#C0392B;}
  .est-card.baixo .est-nome{color:#8A2A22;}
  .est-info{margin-top:4px;font-size:12.5px;color:var(--cinza);}
  .est-barra{margin-top:10px;height:6px;border-radius:6px;background:var(--linha);overflow:hidden;}
  .est-barra i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--cinza),var(--tinta));}
  .est-card.baixo .est-barra i{background:linear-gradient(90deg,#D9614F,#C0392B);}
  .est-acoes{margin-top:11px;display:flex;gap:8px;}
  .est-acoes button{border:none;cursor:pointer;font-family:inherit;font-size:12px;font-weight:600;color:var(--grafite);background:rgba(28,28,30,0.07);padding:6px 12px;border-radius:999px;}
  .alerta{margin-top:14px;background:#fff;border:1px solid var(--linha);border-left:4px solid var(--cinza);border-radius:12px;padding:11px 14px;font-size:13px;color:var(--grafite);line-height:1.45;}
  .alerta.urgente{border-left-color:#C0392B;color:#8A2A22;font-weight:600;background:#FDF3F2;}
  .confirma-box{margin-top:18px;background:#fff;border:1px solid var(--borda-med);border-radius:14px;padding:14px 15px;box-shadow:0 8px 22px rgba(28,28,30,0.08);}
  .confirma-box .pergunta{font-size:14.5px;font-weight:600;color:var(--tinta);line-height:1.4;}
  .confirma-box .acoes{margin-top:11px;display:flex;gap:8px;}
  .confirma-box .sim{border:none;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;color:#fff;background:linear-gradient(135deg,var(--tinta),var(--grafite));padding:9px 16px;border-radius:999px;}
  .confirma-box .nao{border:none;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;color:var(--grafite);background:rgba(28,28,30,0.07);padding:9px 16px;border-radius:999px;}
  .avisos{margin-top:24px;text-align:center;}
  .avisos button{border:none;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;color:#fff;background:linear-gradient(135deg,var(--tinta),var(--grafite));padding:11px 18px;border-radius:999px;}
  .aviso-status{margin-top:9px;font-size:12.5px;color:var(--cinza);line-height:1.45;}
  .esqueci{margin-top:14px;text-align:center;}
  .esqueci button{border:none;background:none;cursor:pointer;font-family:inherit;font-size:12.5px;color:var(--cinza);text-decoration:underline;padding:4px;}
  .login .aviso{font-size:12.5px;color:var(--grafite);margin-bottom:12px;min-height:16px;}
  .sair{margin-top:18px;text-align:center;}
  .sair button{border:none;background:none;cursor:pointer;font-family:inherit;font-size:12px;color:var(--texto-suave);text-decoration:underline;}

  /* comemoração */
  #confete{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60;}
  .parabens{position:fixed;left:50%;top:36%;transform:translate(-50%,-50%) scale(.8);z-index:61;background:#fff;border:1px solid var(--linha);border-radius:22px;padding:26px 34px;text-align:center;box-shadow:0 24px 70px rgba(28,28,30,0.28);opacity:0;pointer-events:none;transition:opacity .3s ease, transform .3s ease;}
  .parabens.mostra{opacity:1;transform:translate(-50%,-50%) scale(1);}
  .parabens h3{font-size:27px;font-weight:700;background:linear-gradient(135deg,var(--tinta),var(--cinza));-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:6px;}
  .parabens p{font-size:14px;color:var(--cinza);}

  footer{margin-top:30px;font-size:11.5px;color:var(--texto-suave);text-align:center;}
  @media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important;}}
  @media print{body{background:#fff;}.timeline::before{opacity:1;}.barra button,.cal-resumo button,.cal-nav{display:none;}}
</style>
</head>
<body>
  <div class="overlay" id="overlay">
    <div class="login">
      <h2>Entrar</h2>
      <p id="loginMsg">Use o seu email e senha para acessar a sua rotina.</p>
      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="username" inputmode="email">
      <label for="senha">Senha</label>
      <input type="password" id="senha" autocomplete="current-password">
      <div class="erro" id="loginErro"></div>
      <button id="entrar" type="button">Entrar</button>
      <div class="esqueci"><button id="esqueci" type="button">esqueci a minha senha</button></div>
    </div>
  </div>
  <canvas id="confete"></canvas>
  <div class="parabens" id="parabens">
    <h3>Parabéns</h3>
    <p>Você concluiu a sua rotina de hoje</p>
  </div>
  <main class="day">
    <header>
      <div class="eyebrow">rotina do dia</div>
      <h1>Sua rotina completa</h1>
      <p class="data" id="dataHoje"></p>
      <div class="tabs">
        <button class="tab ativo" id="tabHoje" type="button">Dia</button>
        <button class="tab" id="tabMes" type="button">Mês</button>
        <button class="tab" id="tabEstoque" type="button">Estoque</button>
      </div>
    </header>

    <!-- VISÃO DO DIA -->
    <section id="viewHoje">
      <div id="confirma"></div>
      <div class="barra">
        <span class="texto" id="contador">0 de 7 itens concluídos</span>
        <button id="limparDia" type="button">limpar dia</button>
      </div>
      <div class="editando" id="editando"></div>
      <div id="alerta"></div>

      <ol class="timeline" id="lista">
        <li class="entry med" data-id="atentah">
          <span class="node"></span>
          <label class="card">
            <input type="checkbox" class="chk"><span class="box"></span>
            <span class="hora">10:00</span>
            <span class="conteudo">
              <span class="item">Atentah 60 mg</span>
            </span>
          </label>
        </li>
        <li class="entry med" data-id="alprazolam-tarde">
          <span class="node"></span>
          <label class="card">
            <input type="checkbox" class="chk"><span class="box"></span>
            <span class="hora">16:30</span>
            <span class="conteudo">
              <span class="item">Alprazolam 0,5 mg</span>
            </span>
          </label>
        </li>
        <li class="entry med" data-id="lubip">
          <span class="node"></span>
          <label class="card">
            <input type="checkbox" class="chk"><span class="box"></span>
            <span class="hora">17:00</span>
            <span class="conteudo">
              <span class="item">Lubip 40 mg</span>
              <span class="nota">2 comprimidos de 20 mg, com o almoço</span>
            </span>
          </label>
        </li>
        <li class="entry med" data-id="litio-20">
          <span class="node"></span>
          <label class="card">
            <input type="checkbox" class="chk"><span class="box"></span>
            <span class="hora">18:00</span>
            <span class="conteudo">
              <span class="item">Carbonato de lítio 900 mg</span>
              <span class="nota">3 comprimidos de 300 mg</span>
            </span>
          </label>
        </li>
        <li class="entry med" data-id="lamitor">
          <span class="node"></span>
          <label class="card">
            <input type="checkbox" class="chk"><span class="box"></span>
            <span class="hora">18:00</span>
            <span class="conteudo">
              <span class="item">Lamotrigina 200 mg</span>
              <span class="nota">2 comprimidos de 100 mg</span>
            </span>
          </label>
        </li>
        <li class="entry med" data-id="quetiapina">
          <span class="node"></span>
          <label class="card">
            <input type="checkbox" class="chk"><span class="box"></span>
            <span class="hora">19:00</span>
            <span class="conteudo">
              <span class="item">Quetiapina 25 mg</span>
            </span>
          </label>
        </li>
        <li class="entry med" data-id="alprazolam-noite">
          <span class="node"></span>
          <label class="card">
            <input type="checkbox" class="chk"><span class="box"></span>
            <span class="hora">20:00</span>
            <span class="conteudo">
              <span class="item">Alprazolam 1 mg</span>
            </span>
          </label>
        </li>
      </ol>
    </section>

    <!-- VISÃO DO MÊS -->
    <section id="viewMes" class="escondido">
      <div class="cal-topo">
        <span class="cal-titulo" id="calTitulo"></span>
        <div class="cal-nav">
          <button id="mesAnterior" type="button" aria-label="mês anterior">‹</button>
          <button id="mesProximo" type="button" aria-label="próximo mês">›</button>
        </div>
      </div>
      <div class="cal-grid" id="calGrid"></div>
      <div class="cal-resumo">
        <span class="texto" id="calResumo">0 dias completos</span>
        <button id="limparMes" type="button">limpar mês</button>
      </div>
    </section>

    <!-- VISÃO DO ESTOQUE -->
    <section id="viewEstoque" class="escondido">
      <p class="est-intro" id="estIntro"></p>
      <div class="estoque-lista" id="estoqueLista"></div>
    </section>

    <div class="avisos">
      <button id="btAvisos" type="button">Ligar os avisos neste aparelho</button>
      <div class="aviso-status" id="avisoStatus"></div>
    </div>

    <div class="sair"><button id="sair" type="button">sair desta conta</button></div>
    <footer>organizado com carinho para a sua rotina diária</footer>
  </main>

  quetiapina:  { nome:"Quetiapina",                curto:"quetiapina",         mgPorCp:null, diaria:25,  baseMg:59*50+32*25, detalhe:"começou com 59 comprimidos de 50 mg e 32 de 25 mg" },
  alprazolam:  { nome:"Alprazolam",                curto:"alprazolam",         mgPorCp:null, diaria:1.5, baseMg:52*1+8*2,   detalhe:"começou com 52 comprimidos de 1 mg e 8 de 2 mg" }

const DOSES = {
  "atentah":          { med:"atentah",     mg:60 },
  "alprazolam-tarde": { med:"alprazolam",  mg:0.5 },

  "quetiapina":       { med:"quetiapina",  mg:25 },

};

const DATA_BASE = "2026-08-21";
const LIMITE_ALERTA = 15;
const LIMITE_VERMELHO = 7;

const estoquePadrao = () => {
  const mg = {};
  Object.keys(MEDS).forEach(k => mg[k] = MEDS[k].baseMg);
  return { data: DATA_BASE, mg };
};

const MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];

const maiuscula = t => t.charAt(0).toUpperCase() + t.slice(1);
const porExtenso = d => maiuscula(d.toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long",year:"numeric"}));

// ----- estoque -----
const estoqueLista = document.getElementById("estoqueLista");
const estIntro = document.getElementById("estIntro");
const alertaBox = document.getElementById("alerta");

const fmtNum = n => Number(Number(n).toFixed(2)).toLocaleString("pt-BR");

function dataBase(){ return (estado.estoque && estado.estoque.data) ? estado.estoque.data : DATA_BASE; }

function baseDe(id){
  const m = (estado.estoque && estado.estoque.mg) ? estado.estoque.mg : {};
  return (typeof m[id] === "number") ? m[id] : MEDS[id].baseMg;
}

function consumido(id){
  const base = dataBase();
  let mg = 0;
  Object.keys(estado.dias).forEach(dia=>{
    if(dia < base) return;
    const o = estado.dias[dia] || {};
    Object.keys(DOSES).forEach(k=>{
      if(o[k] && DOSES[k].med === id) mg += DOSES[k].mg;
    });
  });
  return mg;
}

function restante(id){ return Math.max(0, baseDe(id) - consumido(id)); }

function tomouHoje(id){
  const o = readDay(hojeIso);
  const ids = Object.keys(DOSES).filter(k=>DOSES[k].med === id);
  return ids.length > 0 && ids.every(k=>!!o[k]);
}

function previsao(id){
  const r = restante(id);
  const dias = r / MEDS[id].diaria;
  if(r <= 0) return { dias:0, data:null };
  const desloc = Math.max(0, Math.floor(dias) - 1 + (tomouHoje(id) ? 1 : 0));
  const d = new Date(hoje);
  d.setDate(d.getDate() + desloc);
  return { dias, data:d };
}

function dataPorExtenso(d){
  const texto = d.toLocaleDateString("pt-BR",{day:"numeric",month:"long"});
  return d.getFullYear() === hoje.getFullYear() ? texto : texto + " de " + d.getFullYear();
}

function ajustar(id){
  const m = MEDS[id];
  const r = restante(id);
  let valor;
  if(m.mgPorCp){
    const entrada = prompt("Quantos comprimidos de " + fmtNum(m.mgPorCp) + " mg de " + m.curto + " você tem agora?", fmtNum(r / m.mgPorCp));
    if(entrada === null) return;
    const cp = parseFloat(String(entrada).replace(",","."));
    if(isNaN(cp) || cp < 0) return;
    valor = cp * m.mgPorCp;
  } else {
    const entrada = prompt("Quantos miligramas de " + m.curto + " você tem agora, somando todas as apresentações?", fmtNum(r));
    if(entrada === null) return;
    const mg = parseFloat(String(entrada).replace(",","."));
    if(isNaN(mg) || mg < 0) return;
    valor = mg;
  }
  if(!estado.estoque || !estado.estoque.mg) estado.estoque = estoquePadrao();
  estado.estoque.mg[id] = consumido(id) + valor;
  salvar();
  renderEstoque();
}

function renderEstoque(){
  if(!estoqueLista) return;
  estIntro.textContent = "Contagem a partir de " + dataPorExtenso(parseIso(dataBase())) +
    ". Cada dose marcada na aba do dia desconta do estoque, e desmarcar devolve.";
  estoqueLista.innerHTML = "";
  Object.keys(MEDS).forEach(id=>{
    const m = MEDS[id];
    const r = restante(id);
    const p = previsao(id);
    const baixo = p.dias < LIMITE_VERMELHO;

    const card = document.createElement("div");
    card.className = "est-card" + (baixo ? " baixo" : "");

    const topo = document.createElement("div");
    topo.className = "est-topo";
    const nome = document.createElement("span");
    nome.className = "est-nome"; nome.textContent = m.nome;
    const dias = document.createElement("span");
    dias.className = "est-dias";
    dias.textContent = r <= 0 ? "acabou" : fmtNum(Math.round(p.dias*10)/10) + " dias";
    topo.appendChild(nome); topo.appendChild(dias);

    const info = document.createElement("div");
    info.className = "est-info";
    let texto = m.mgPorCp
      ? fmtNum(r / m.mgPorCp) + " comprimidos de " + fmtNum(m.mgPorCp) + " mg"
      : fmtNum(r) + " mg no total";
    if(p.data) texto += ", acaba por volta de " + dataPorExtenso(p.data);
    if(m.detalhe) texto += ". " + m.detalhe;
    info.textContent = texto;

    const barra = document.createElement("div");
    barra.className = "est-barra";
    const fita = document.createElement("i");
    const cheio = baseDe(id) > 0 ? Math.max(0, Math.min(1, r / baseDe(id))) : 0;
    fita.style.width = (cheio*100).toFixed(1) + "%";
    barra.appendChild(fita);

    const acoes = document.createElement("div");
    acoes.className = "est-acoes";
    const bt = document.createElement("button");
    bt.type = "button"; bt.textContent = "corrigir a quantidade";
    bt.addEventListener("click",()=>ajustar(id));
    acoes.appendChild(bt);

    card.appendChild(topo); card.appendChild(info);
    card.appendChild(barra); card.appendChild(acoes);
    estoqueLista.appendChild(card);
  });
  renderAlerta();
}

function renderAlerta(){
  if(!alertaBox) return;
  const baixos = Object.keys(MEDS)
    .map(id=>({ id, dias: previsao(id).dias }))
    .filter(x=>x.dias < LIMITE_ALERTA)
    .sort((a,b)=>a.dias-b.dias);
  if(baixos.length === 0){ alertaBox.innerHTML = ""; return; }
  const urgente = baixos.some(x=>x.dias < LIMITE_VERMELHO);
  const lista = baixos.map(x=> MEDS[x.id].curto + " em " + fmtNum(Math.round(x.dias)) + " dias").join(", ");
  const div = document.createElement("div");
  div.className = "alerta" + (urgente ? " urgente" : "");
  div.textContent = (urgente ? "Comprar agora: " : "Comprar em breve: ") + lista + ".";
  alertaBox.innerHTML = "";
  alertaBox.appendChild(div);
}

function salvar(){
  if(!docRef) return;
  setDoc(docRef, { dias: estado.dias, estoque: estado.estoque }, { merge: true }).catch(e=>console.error("Erro ao salvar:", e));
}

function renderMes(){
  calTitulo.textContent = maiuscula(MESES[mesView.m])+" de "+mesView.y;
  calGrid.innerHTML = "";
  DOW.forEach(d=>{
    const h=document.createElement("div"); h.className="cal-dow"; h.textContent=d; calGrid.appendChild(h);
  });
  const offset = new Date(mesView.y,mesView.m,1).getDay();
  const dias = new Date(mesView.y,mesView.m+1,0).getDate();
  for(let i=0;i<offset;i++){
    const v=document.createElement("div"); v.className="cal-cell cal-vazio"; calGrid.appendChild(v);
  }
  let completos=0;
  for(let d=1;d<=dias;d++){
    const s = iso(new Date(mesView.y,mesView.m,d));
    const cnt = doneCount(s);
    const ratio = cnt/TOTAL;
    if(cnt===TOTAL) completos++;
    const cell=document.createElement("div");
    cell.className="cal-cell";
    cell.dataset.iso=s;
    if(s===hojeIso) cell.classList.add("hoje");
    if(cnt===TOTAL){
      cell.classList.add("cheio");
      cell.style.background="linear-gradient(145deg,var(--tinta),var(--grafite))";
      cell.style.borderColor="var(--tinta)";
    } else if(cnt>0){
      cell.style.background="rgba(28,28,30,"+(0.08+0.32*ratio).toFixed(2)+")";
    }
    const num=document.createElement("span"); num.textContent=d;
    const frac=document.createElement("span"); frac.className="frac"; frac.textContent=cnt+"/"+TOTAL;
    cell.appendChild(num); cell.appendChild(frac);
    cell.addEventListener("click",()=>{ selecionado=parseIso(s); mostrar("hoje"); renderDia(); });
    calGrid.appendChild(cell);
  }
  calResumo.textContent = completos+(completos===1?" dia completo":" dias completos");
}

const canvas = document.getElementById("confete");
const ctx = canvas.getContext("2d");
const CORES = ["#1C1C1E","#4A4A4F","#6E6E73","#9B9BA1","#C9C9CE"];
let particulas = [];
let confeteRAF = null;

function ajustarCanvas(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
ajustarCanvas();
window.addEventListener("resize", ajustarCanvas);

function lancarConfete(){
  for(let i=0;i<150;i++){
    particulas.push({
      x: Math.random()*canvas.width,
      y: -20 - Math.random()*canvas.height*0.4,
      w: 6+Math.random()*7,
      h: 9+Math.random()*9,
      cor: CORES[Math.floor(Math.random()*CORES.length)],
      vx: -2.5+Math.random()*5,
      vy: 2+Math.random()*4.5,
      rot: Math.random()*Math.PI,
      vr: -0.25+Math.random()*0.5
    });
  }
  if(!confeteRAF) animarConfete();
}

function animarConfete(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  particulas.forEach(p=>{
    p.x += p.vx; p.y += p.vy; p.vy += 0.06; p.rot += p.vr;
    ctx.save();
    ctx.translate(p.x,p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle = p.cor;
    ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
    ctx.restore();
  });
  particulas = particulas.filter(p=> p.y < canvas.height+40);
  if(particulas.length>0){
    confeteRAF = requestAnimationFrame(animarConfete);
  } else {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    confeteRAF = null;
  }
}

function comemorar(){
  lancarConfete();
  const el = document.getElementById("parabens");
  el.classList.add("mostra");
  setTimeout(()=>{ el.classList.remove("mostra"); }, 3200);
}

let appFB = null;
let messaging = null;
const btAvisos = document.getElementById("btAvisos");
const avisoStatus = document.getElementById("avisoStatus");

function statusAvisos(texto){ if(avisoStatus) avisoStatus.textContent = texto || ""; }

async function ligarAvisos(){
  if(!docRef){ statusAvisos("Entre na sua conta antes de ligar os avisos."); return; }
  if(VAPID_KEY.indexOf("COLE") === 0){ statusAvisos("Falta colar a chave do Web Push no arquivo."); return; }
  const ehIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  const naTelaInicial = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  if(ehIOS && !naTelaInicial){
    statusAvisos("No iPhone, salve este aplicativo na tela inicial pelo botão de compartilhar do Safari e abra por lá. Só assim o aviso chega com a tela bloqueada.");
    return;
  }
  if(typeof Notification === "undefined" || !("serviceWorker" in navigator)){
    statusAvisos("Este navegador não recebe avisos.");
    return;
  }
  try{
    // A permissão precisa ser pedida logo no toque, sem nenhuma espera antes,
    // senão o Safari deixa de considerar que houve um gesto seu.
    const permissao = Notification.permission === "granted"
      ? "granted"
      : await Notification.requestPermission();
    if(permissao !== "granted"){ statusAvisos("Sem a permissão o aviso não aparece na tela bloqueada."); return; }

    const suportado = await isSupported().catch(()=>false);
    if(!suportado){ statusAvisos("Este navegador não recebe avisos."); return; }

    const registro = await navigator.serviceWorker.register("firebase-messaging-sw.js");
    await navigator.serviceWorker.ready;
    if(!messaging) messaging = getMessaging(appFB);
    const token = await getToken(messaging, { vapidKey: VAPID_KEY, serviceWorkerRegistration: registro });
    if(!token){ statusAvisos("Não foi possível registrar este aparelho."); return; }
    await setDoc(docRef, { tokens: arrayUnion(token) }, { merge: true });
    statusAvisos("Avisos ligados neste aparelho.");
  } catch(erro){
    const codigo = erro && (erro.code || erro.name) ? " [" + (erro.code || erro.name) + "]" : "";
    statusAvisos("Não deu para ligar os avisos agora." + codigo + " " + (erro && erro.message ? erro.message : ""));
  }
}

if(btAvisos) btAvisos.addEventListener("click", ligarAvisos);

function traduzErro(code){
  if(code==="auth/invalid-email") return "Email inválido.";
  if(code==="auth/too-many-requests") return "Muitas tentativas. Tente novamente mais tarde.";
  if(code==="auth/network-request-failed") return "Sem conexão. Verifique a internet.";
  if(["auth/invalid-credential","auth/wrong-password","auth/user-not-found"].includes(code)) return "Email ou senha incorretos.";
  return "Não foi possível entrar. Tente novamente.";
}

  onAuthStateChanged(auth, user=>{
    if(user){
      overlay.classList.add("escondido");
      docRef = doc(db, "usuarios", user.uid);
      onSnapshot(docRef, snap=>{
        estado.dias = (snap.exists() && snap.data().dias) ? snap.data().dias : {};
        estado.estoque = (snap.exists() && snap.data().estoque) ? snap.data().estoque : estoquePadrao();
        renderDia();
        renderEstoque();
        if(!viewMes.classList.contains("escondido")) renderMes();
      }, err=>console.error("Erro de leitura:", err));
    } else {
      overlay.classList.remove("escondido");
      docRef=null;
    }
  });
} else {
  loginMsg.textContent="Configure o Firebase no arquivo antes de usar.";
  loginErro.textContent="Cole o firebaseConfig no index.html, no lugar indicado.";
  entrarBtn.disabled=true;
}
</script>
</body>
</html>
